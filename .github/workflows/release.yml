# Builds and tests Ankhwiz on GitHub's own machines.
#
# Every push and pull request: the core's tests, the interface's tests and
# the type check. A tag like v0.4.1: all of that, then the Windows installer
# and portable zip, the Linux .deb and AppImage, the Android APK and the
# one-file version, gathered into a draft release to check and publish.
#
# Android signing: add these repository secrets to sign with your own
# release key (otherwise the APK is signed with a new test key, which cannot
# update an app installed from another build):
#   ANDROID_KEYSTORE_BASE64   the .jks/.keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS

name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path core/Cargo.toml
      - name: The checked-in WebAssembly core matches the Rust source
        run: |
          scripts/build-core.sh
          git diff --exit-code --stat src/lib/core/wasm.generated.ts || echo "::warning::wasm.generated.ts differs from a fresh build (compiler versions differ); the tests below use the fresh one."
      - run: npm ci
      - run: npm test
      - run: npm run check

  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Installer and portable zip
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out/Ankhwiz
          cp src-tauri/target/release/ankhwiz.exe out/Ankhwiz/Ankhwiz.exe
          cp src-tauri/target/release/WebView2Loader.dll out/Ankhwiz/ 2>/dev/null || true
          cp windows/READ-ME-FIRST.txt out/Ankhwiz/
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=$VERSION -DSRC="$PWD/out/Ankhwiz" -DOUT="$PWD/out/Ankhwiz-$VERSION-windows-setup.exe" -DICON="$PWD/src-tauri/icons/icon.ico" windows/installer.nsi
          (cd out && 7z a "Ankhwiz-$VERSION-windows-x64.zip" Ankhwiz)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.exe
            out/*.zip

  android-and-web:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANKHWIZ_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANKHWIZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANKHWIZ_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          export PATH="$TOOLS:$PATH"
          export ANDROID_JAR=$(ls -d "$ANDROID_SDK_ROOT"/platforms/android-* | sort -V | tail -1)/android.jar
          export DX="$TOOLS/d8"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANKHWIZ_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          scripts/build-android.sh
      - name: One-file version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp dist-single/index.html "android/build/Ankhwiz-$VERSION.html"
      - uses: actions/upload-artifact@v4
        with:
          name: android-and-web
          path: |
            android/build/*.apk
            android/build/*.html

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android-and-web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: files/**
