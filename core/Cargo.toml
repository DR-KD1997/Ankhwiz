[package]
name = "ankhwiz-core"
version = "0.4.1+1"
edition = "2021"
description = "Ankhwiz learning core: stages, grading, sessions, lesson splitting and AI request building"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
sha1_smol = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
